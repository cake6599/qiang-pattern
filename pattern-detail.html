====================== */

grid-template-columns:

265px 1fr;


gap:80px;

左侧

flex-direction:column;

gap:24px;

.pattern-preview-box{

2px solid #2254a8;

border-radius:12px;

overflow:hidden;

background:#111;

.pattern-label-info h3{


font-size:14px;
font-weight: 500;
margin:0 0 -5px;

.pattern-label-info p{


color:#f9f9f9;

font-size:13px;
font-weight: 400;
line-height:1.1;
width:200px;
word-break:break-all;

background:#174b91;

padding:

4px 15px;

}

播放区域
====================== */


.audio-player {

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    width:90px;

    gap:8px;

}

.left-info-box{

    display:flex;

    align-items:center;

    gap:15px;

}


.pattern-label-info{

    flex:1;

}



.wave-canvas{

    width:90px;

    height:35px;

}


.play-btn{

    width:60px;

    height:60px;

}



.play-btn{


width:64px;

height:64px;


border-radius:50%;


border:

2px solid white;


background:transparent;


color:white;


font-size:30px;


cursor:pointer;


display:grid;

place-items:center;


transition:.3s;


}



.play-btn:hover{


background:#2254a8;


}




.wave-canvas {

    width:120px;

    height:45px;

}



/* ======================
右侧
====================== */


.right-panel{

min-height:520px;
min-width:0;

overflow:visible;

}



.tab-content-item{


display:none;


}



.tab-content-item.show{

display:flex;

flex-direction:column;

gap: 30px;

min-height:1000px;

}



.line-blue{


height:3px;

width:100%;


background:#2254a8;


}




/* 缩略图 */


.thumb-row{


display:flex;

gap:88px;

}


.thumb-row img{


width:80px;

height:80px;

border-radius:50%;


}



/* ======================
信息模块
====================== */


.info-item{

    display:flex;

    align-items:flex-start;

    gap:16px;

    padding:30px 30px;

    height:130px;   /* 三个内容统一高度 */




/* background:

rgba(20,20,20,.85); */



border:none;


position:relative;


cursor:pointer;


transition:transform .35s ease,
            background .35s ease,
            box-shadow .35s ease;

}

.info-item:not(:last-child)::after{


content:"";


position:absolute;


bottom:-5px;


left:0;


width:100%;


height:3px;


background:#5183da;



}






.info-item:hover{

background:
rgba(34,84,168,.35);

box-shadow:
0 0 25px rgba(34,84,168,.7);

}




.info-item.active-highlight{

    transform:scale(1.08);

    margin:20px 50px;          /* 去掉外边距 */

    border-radius:40px; /* 圆角 */

    background:
    rgba(36, 63, 139, 0.95);

    box-shadow:
    0 0 25px rgba(34,84,168,.8);

    padding-top:20px;
    padding-bottom:20px;
}




.info-item img{


width:60px;

height:60px;

border-radius:50%;


}



.info-item h4{


margin:0 0 8px;

font-size:24px;


}



.info-item p{


font-size:17px;

line-height:1.7;

margin:0;


}




/* 全部模式 */


.info-all-mode{


border-top:

3px solid #2254a8;


border-bottom:

3px solid #2254a8;


}


.info-all-mode .info-item{


border:none;


}



.text-content p{


font-size:17px;

line-height:1.8;


}



.color-row{

display:flex;

gap:120px;

flex-wrap:nowrap;

}


.color-block{


width:90px;

height:40px;

margin-bottom:6px;


}



.color-item{


text-align:center;

}



</style>

</head>
<body>

<div class="wrap-container">


<header class="site-header">

<div class="site-brand">

<div class="brand-badge"></div>

<span>
羌族纹样
</span>

</div>


<nav class="main-nav">

<a href="./index.html#home">
首页
</a>


<a href="./index.html#patterns">
纹样欣赏
</a>

</nav>

</header>



<main>


<section class="detail-wrap">


<div class="bg-material bg-pattern-bg"></div>



<div class="detail-inner">


<div class="detail-top-bar">


<div class="detail-title">


<h2>

纹样信息

<span>
Pattern Information
</span>

</h2>


</div>




<div class="tab-nav">


<span class="active" data-tab="all">
全部
</span>


<span data-tab="info">
相关信息
</span>


<span data-tab="mean">
语义含义
</span>


<span data-tab="story">
历史故事
</span>


</div>



</div>





<div class="detail-layout">



<!-- 左侧 -->


<div class="left-panel">



<div class="pattern-preview-box">


<img id="patternImg">


</div>



<div class="left-info-box">


    <div class="pattern-label-info">

        <h3 id="patternName"></h3>

        <p id="patternDesc"></p>

        <span class="tag-type" id="patternTag"></span>

    </div>



    <div class="audio-player">

        <button class="play-btn" id="audioPlayBtn">
            ▶
        </button>


        <canvas class="wave-canvas" id="wave"></canvas>


    </div>


</div>



</div>






<!-- 右侧 -->

<div class="right-panel" id="rightContainer">

</div>



</div>



</div>


</section>


</main>


</div>





<script src="./js/app.js"></script>

<script src="./js/audio.js"></script>



<script>


/*
固定缩略图
*/

const fixedThumb1 =
"./assets/images/thumb/thumb1.png";


const fixedThumb2 =
"./assets/images/thumb/thumb2.png";


const fixedThumb3 =
"./assets/images/thumb/thumb3.png";





function getUrlParam(name){


return new URL(location.href)
.searchParams
.get(name);


}






const imgPath = getUrlParam("img") || "";


let autoTag="植物纹";


if(imgPath.includes("/animal/")){

    autoTag="动物纹";

}


else if(imgPath.includes("/geo/")){

    autoTag="几何纹";

}


else if(imgPath.includes("/plant/")){

    autoTag="植物纹";

}



const params={


img:imgPath,

name:getUrlParam("name"),

desc:getUrlParam("desc"),

tag:autoTag,


sound:getUrlParam("sound"),


text1:getUrlParam("text1"),

text2:getUrlParam("text2"),

text3:getUrlParam("text3"),


infoText:getUrlParam("infoText"),

meanText:getUrlParam("meanText"),

storyText:getUrlParam("storyText"),


colors:""


};







/*
左侧信息
*/


if(params.img)

patternImg.src=params.img;



if(params.name)

patternName.innerText=params.name;




if(params.desc)

patternDesc.innerHTML=
params.desc.replaceAll("|","<br>");



patternTag.innerText=params.tag;







/*
自动提取颜色
*/


function extractColors(src){

return new Promise(resolve=>{


let img=new Image();

img.crossOrigin="anonymous";


img.onload=function(){


let canvas=document.createElement("canvas");

canvas.width=400;
canvas.height=400;


let ctx=canvas.getContext("2d");

ctx.filter="saturate(150%) contrast(120%)";
ctx.drawImage(
img,
0,
0,
400,
400
);



let data=
ctx.getImageData(
0,
0,
400,
400
).data;



let colors=[];



for(let i=0;i<data.length;i+=4){


let r=data[i];
let g=data[i+1];
let b=data[i+2];



let max=Math.max(r,g,b);
let min=Math.min(r,g,b);


// RGB转HSV

let s =
max===0 ? 0 :
(max-min)/max;



let v=max/255;



//过滤背景

// 太黑
if(v<0.15)
continue;


// 太白
if(v>0.95 && s<0.1)
continue;


// 灰色
if(s<0.25)
continue;



colors.push([
r,g,b
]);


}




// 如果过滤后太少
if(colors.length<20){

resolve([
"#8B4513",
"#D4A017",
"#A52A2A",
"#1E3A8A",
"#228B22"
]);

return;

}




// 五色聚类


let centers=[];


for(let i=0;i<5;i++){

centers.push(
colors[
Math.floor(
Math.random()*colors.length
)
]
);

}




for(let k=0;k<15;k++){


let groups=[
[],[],[],[],[]
];



colors.forEach(p=>{


let best=0;

let dist=999999;



centers.forEach((c,i)=>{


let d=
(p[0]-c[0])**2+
(p[1]-c[1])**2+
(p[2]-c[2])**2;



if(d<dist){

dist=d;

best=i;

}


});



groups[best].push(p);



});




centers=
groups.map(g=>{


if(g.length===0)
return [0,0,0];


let r=0;
let g1=0;
let b=0;


g.forEach(p=>{

r+=p[0];
g1+=p[1];
b+=p[2];

});


return [

Math.round(r/g.length),

Math.round(g1/g.length),

Math.round(b/g.length)

];


});


}




resolve(

centers.map(c=>

"#"+
c.map(x=>

x.toString(16)
.padStart(2,"0")

).join("")

)

);



};



img.src=src;



});


}










function buildRightHtml(){



let html="";





/*
全部
*/


html+=`

<div class="tab-content-item show"
data-content="all">


<div class="line-blue"></div>


<div class="thumb-row">


<img src="${fixedThumb1}">

<img src="${fixedThumb2}">

<img src="${fixedThumb3}">

<img src="${fixedThumb1}">

<img src="${fixedThumb2}">

<img src="${fixedThumb3}">

</div>



<div class="text-content">


<p>${params.text1||""}</p>

<p>${params.text2||""}</p>

<p>${params.text3||""}</p>


</div>




<div class="color-row">


${
params.colors
.split(",")
.map(c=>`

<div class="color-item">


<div class="color-block"
style="background:${c}">
</div>


<span>
${c}
</span>


</div>


`)
.join("")
}


</div>



<div class="line-blue"></div>


</div>



`;








/*
三个内容
*/


html+=`

<div class="tab-content-item"
data-content="info-group">


<div class="line-blue"></div>



<div class="info-wrap">



<div class="info-item"
data-target="info">


<img src="${fixedThumb1}">


<div>

<h4>
相关信息
</h4>


<p>
${params.infoText||""}
</p>


</div>


</div>





<div class="info-item"
data-target="mean">


<img src="${fixedThumb2}">


<div>

<h4>
语义含义
</h4>


<p>
${params.meanText||""}
</p>


</div>


</div>





<div class="info-item"
data-target="story">


<img src="${fixedThumb3}">


<div>

<h4>
历史故事
</h4>


<p>
${params.storyText||""}
</p>


</div>


</div>



</div>




<div class="line-blue"></div>



</div>



`;





rightContainer.innerHTML=html;



bindTabEvent();

bindInfoClick();


}










function bindTabEvent(){



let tabs=
document.querySelectorAll(".tab-nav span");



let contents=
document.querySelectorAll(".tab-content-item");





tabs.forEach(tab=>{


tab.onclick=function(){



tabs.forEach(t=>

t.classList.remove("active")

);


this.classList.add("active");



contents.forEach(c=>

c.classList.remove("show")

);





let key=this.dataset.tab;





if(key==="all"){


document
.querySelector('[data-content="all"]')
.classList.add("show");


}





else{


let box=
document
.querySelector('[data-content="info-group"]');


box.classList.add("show");



document
.querySelectorAll(".info-item")
.forEach(i=>

i.classList.remove(
"active-highlight"
)

);



let item=
document
.querySelector(
`.info-item[data-target="${key}"]`
);



if(item)

item.classList.add(
"active-highlight"
);



}



}



})


}








function bindInfoClick(){


document
.querySelectorAll(".info-item")
.forEach(item=>{


item.onclick=function(){



// 清除其他高亮

document
.querySelectorAll(".info-item")
.forEach(i=>{

i.classList.remove(
"active-highlight"
);

});



// 当前放大

this.classList.add(
"active-highlight"
);



// 获取当前内容类型

let target =
this.dataset.target;




// 同步顶部导航

document
.querySelectorAll(".tab-nav span")
.forEach(tab=>{


tab.classList.remove(
"active"
);



if(tab.dataset.tab===target){

tab.classList.add(
"active"
);

}


});



};


});


}









/*
播放控制
*/


const playBtn=
document.getElementById(
"audioPlayBtn"
);



let playing=false;



playBtn.onclick=async()=>{


if(!playing){



await window.playPattern(params.sound);


playBtn.innerHTML="Ⅱ";


playing=true;



}

else{


window.stopAudio();


playBtn.innerHTML="▶";


playing=false;


}



};





window.addEventListener(
"audio-stop",
()=>{


playBtn.innerHTML="▶";


playing=false;


}

);








/*
初始化

先提取颜色
*/


if(params.img){


extractColors(params.img)

.then(colors=>{


let defaultColors=[
"#000000",
"#ffffff",
"#b88935",
"#2254a8",
"#8b4513"
];


while(colors.length<5){

colors.push(
defaultColors[colors.length]
);

}



params.colors=
colors.slice(0,5).join(",");



buildRightHtml();



});


}

else{


buildRightHtml();

}



</script>


</body>

</html>
